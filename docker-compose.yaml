version: '3.8'

services:
  conta-corrente-api:
    build:
      context: .
      dockerfile: src/BankMore.ContaCorrente.API/Dockerfile
    ports:
      - "7001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/BankMoreContaCorrente.db
      - Kafka__BootstrapServers=kafka:9092
    volumes:
      - ./data:/app/data
    depends_on:
      - kafka
    networks:
      - bankmore-network

  transferencia-api:
    build:
      context: .
      dockerfile: src/BankMore.Transferencia.API/Dockerfile
    ports:
      - "7002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/BankMoreTransferencia.db
      - ContaCorrenteApi__BaseUrl=http://conta-corrente-api:8080
      - Kafka__BootstrapServers=kafka:9092
    volumes:
      - ./data:/app/data
    depends_on:
      - conta-corrente-api
      - kafka
    networks:
      - bankmore-network

  tarifa-api:
    build:
      context: .
      dockerfile: src/BankMore.Tarifa.API/Dockerfile
    ports:
      - "7003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/BankMoreTarifa.db
      - Kafka__BootstrapServers=kafka:9092
    volumes:
      - ./data:/app/data
    depends_on:
      - kafka
    networks:
      - bankmore-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bankmore-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - bankmore-network

networks:
  bankmore-network:
    driver: bridge

volumes:
  data:
